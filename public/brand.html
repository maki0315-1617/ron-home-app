<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>ロンAIシステムズ ロゴ</title>
    <style>
      :root {
        color: #111;
        background: #fff;
        font-family: "Yu Gothic", YuGothic, "Hiragino Sans", Meiryo, sans-serif;
      }
      body {
        margin: 0;
        padding: 40px 20px 64px;
      }
      main {
        max-width: 880px;
        margin: 0 auto;
      }
      h1 {
        font-size: 28px;
        margin: 0 0 8px;
      }
      p {
        line-height: 1.7;
        margin: 0 0 16px;
      }
      .card {
        border: 1px solid #e6e6e6;
        margin: 28px 0;
        padding: 24px;
      }
      .preview {
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 180px;
        margin-bottom: 16px;
      }
      .preview img {
        max-width: 100%;
        height: auto;
      }
      .dark {
        background: #111;
      }
      .links a {
        display: inline-block;
        margin: 6px 8px 0 0;
        padding: 8px 14px;
        background: #111;
        color: #fff;
        text-decoration: none;
        font-size: 14px;
      }
      .links a.red {
        background: #e10600;
      }
      .note {
        color: #444;
        font-size: 14px;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>ロンAIシステムズ ロゴ</h1>
      <p>
        黒を基調に、赤は「AI」と健康の脈拍だけに使っています。Rの中のAと、脈拍の先の縦線Iで、RとAIを一つのマークにしています。
      </p>
      <section class="card">
        <div class="preview">
          <img src="/brand/ron-ai-systems-logo.svg" alt="ロンAIシステムズの横組みロゴ" width="720" />
        </div>
        <div class="links">
          <a class="red" href="/brand/ron-ai-systems-logo.svg" download>横組み SVG</a>
          <a href="/brand/ron-ai-systems-logo.png" download>横組み PNG</a>
        </div>
      </section>
      <section class="card">
        <div class="preview">
          <img src="/brand/ron-ai-systems-mark.svg" alt="ロンAIシステムズのマーク" width="240" />
        </div>
        <div class="links">
          <a class="red" href="/brand/ron-ai-systems-mark.svg" download>マーク SVG</a>
          <a href="/brand/ron-ai-systems-mark.png" download>マーク PNG</a>
        </div>
      </section>
      <section class="card">
        <div class="preview dark">
          <img src="/brand/ron-ai-systems-logo-on-dark.svg" alt="黒背景用のロゴ" width="720" />
        </div>
        <div class="links">
          <a href="/brand/ron-ai-systems-logo-on-dark.svg" download>黒背景用 SVG</a>
          <a href="/brand/ron-ai-systems-logo-on-dark.png" download>黒背景用 PNG</a>
        </div>
      </section>
      <p class="note">
        サイトや印刷物には SVG を使ってください。拡大しても形が荒れません。横組みとマークの PNG は背景が透明です。黒背景用は、黒い画面に載せるとき使います。
      </p>
    </main>
  </body>
</html>
